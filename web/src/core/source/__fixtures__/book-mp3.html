<!doctype html>
<html lang="zh-Hans" data-theme="light">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="经典读诵 · 玉机子道长诵读音频">
    <meta name="theme-color" content="#f4efe3">
    <link rel="icon" href="/favicon.ico">
    <title>经典读诵 · 玉机子道长</title>

    <script>
        (function () {
            try {
                var t = localStorage.getItem('yjz-theme');
                if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', t);
            } catch (e) {}
        })();
    </script>

    <link href="/css/bootstrap.min.css" rel="stylesheet">
    <link href="/style.css" rel="stylesheet">
</head>

<body>
    <div class="shell" id="top">

        <header class="masthead">
            <div class="wrap">
                <a href="/index.html" class="brand">
                    <span class="seal">玉機</span>
                    <span class="brand-name">玉机子道长</span>
                </a>
                <span class="spacer"></span>
                <a class="nav-act" href="/index.html">经目</a>
                <button class="nav-act theme-toggle" id="theme-btn" aria-label="切换昼夜">
                    <span class="sun">☀ 昼</span><span class="moon">☾ 夜</span>
                </button>
            </div>
        </header>

        <main role="main">
            <div class="wrap">
                <div class="page-head">
                    <p class="kicker">愿清静 · 济化人间</p>
                    <h1>经典读诵</h1>
                </div>

                <div class="reader">
                    <script type="text/javascript">

    const pageid = "jdds";
    const musicList = [
        { name: '太上老君说常清静经', url: '/经典读诵/太上老君说常清静经.mp3' },
        { name: '阴符经', url: '/经典读诵/阴符经.mp3' },
        { name: '道德经', url: '/经典读诵/道德经.mp3' },
        { name: '太乙金华宗旨', url: '/经典读诵/太乙金華宗旨.mp3' },
        { name: '楞严经四种决定清净明诲', url: '/经典读诵/楞严经四种决定清净明诲(云丹喜若).mp3' },
        { name: '逍遥游', url: '/经典读诵/逍遥游.mp3' },
        { name: '齐物论', url: '/经典读诵/齐物论.mp3' },
        { name: '养生主', url: '/经典读诵/养生主.mp3' },
        { name: '人间世', url: '/经典读诵/人间世.mp3' },
        { name: '德充符', url: '/经典读诵/德充符.mp3' },
        { name: '大宗师', url: '/经典读诵/大宗师.mp3' },
        { name: '应帝王', url: '/经典读诵/应帝王.mp3' },
    ];

</script>

<div class="card-body">

</div>


                </div>

                <!-- 播放器:保留全部 JS 契约 ID,只换皮 -->
                <div class="player" id="player">
                    <div class="row">
                        <div class="grow">
                            <label class="lbl" for="music-select">曲目</label>
                            <select id="music-select" class="field" style="width:100%">
                                <option value="">请选择音频</option>
                            </select>
                        </div>
                        <div>
                            <label class="lbl" for="play-mode">播放方式</label>
                            <select id="play-mode" class="field">
                                <option value="continuous" selected>连续播放</option>
                                <option value="loop">单曲循环</option>
                                <option value="stop-after">播放完停止</option>
                            </select>
                        </div>
                        <div>
                            <label class="lbl" for="myselect">定时关闭</label>
                            <select id="myselect" class="field">
                                <option value="-1">不开启</option>
                                <option value="300000">5 分钟</option>
                                <option value="600000">10 分钟</option>
                                <option value="1800000">30 分钟</option>
                                <option value="3600000">一小时</option>
                                <option value="7200000">两小时</option>
                            </select>
                        </div>
                    </div>

                    <audio id="music-player" controls preload="metadata"></audio>

                    <div class="row" style="margin-top:.7rem; align-items:center">
                        <div class="ctrls">
                            <button class="btn-ink" onclick="back30sec()">后退 30 秒</button>
                            <button class="btn-ink" onclick="forward30sec()">前进 30 秒</button>
                        </div>
                        <span class="spacer"></span>
                        <a id="music-download" class="dl" href="#" download style="display:none">↓ 下载此音频</a>
                        <span style="color:var(--ink-soft);font-size:.85rem;margin-left:1rem">剩余 <span id="remainTime">—</span></span>
                    </div>
                </div>

                <!--
  留言板挂载点。
  配置通过 data-* 传给 js/comments.js，不写死在 JS 里。

  data-api 留空 = **同源**（当前生产模式）：站点在 www.yujizi.org，Cloudflare Worker
  用路由 www.yujizi.org/api/* 接管 /api/*，前端走相对路径。同源不触发 OPTIONS 预检、
  不需要 CORS 头、中间代理也剥不掉跨域头 —— 移动端出过的「网络异常」整类问题由此消失。

  若把 _config.yml 的 comments_api 填成绝对地址（如 https://comments.yujizi.org），
  则回退到跨域模式，后端靠 CORS 白名单放行。调试或换后端时可用。

  样式在 style.css 的「留言板」一节（复用全站令牌，昼夜主题自动跟随）。
-->
<section class="talk" id="talk"
         data-api=""
         data-page="/%E7%BB%8F%E5%85%B8%E8%AF%BB%E8%AF%B5.html"
         aria-label="留言">

    <p class="section-rule">留 言</p>

    <div class="talk-list" id="talk-list">
        <p class="talk-empty">正在载入…</p>
    </div>

    <form class="talk-form" id="talk-form" novalidate>
        <label class="lbl" for="talk-content">说点什么</label>
        <textarea id="talk-content" name="content" rows="4" maxlength="500"
                  placeholder="可留名，也可不留。匿名发言请自惜口德。"></textarea>

        <!-- 蜜罐：正常用户看不见这个字段（.talk-hp 把它移出视口）。
             机器人按字段名盲填，填了后端直接拒。

             ⚠️ 字段名故意用 website —— 这是经典机器人的填充目标，保留它当诱饵。
             但代价是**它同时是自动填充的目标**（密码管理器 / 浏览器自动填充都认
             website 和「网址」这个标签），手机端尤其激进。一旦被自动填上，
             真人提交会被后端当成机器人拒掉 —— 一个很难自查的失败。
             所以下面挂齐各家密码管理器的忽略标记。 -->
        <div class="talk-hp" aria-hidden="true">
            <label for="talk-website">网址</label>
            <input id="talk-website" name="website" type="text"
                   tabindex="-1" autocomplete="off"
                   data-lpignore="true" data-1p-ignore data-bwignore
                   data-form-type="other" value="">
        </div>

        <div class="talk-row">
            <input id="talk-name" name="name" type="text" maxlength="20"
                   placeholder="称呼（可留空）" autocomplete="nickname">
            <span class="spacer"></span>
            <button type="submit" class="btn-ink" id="talk-submit">留 言</button>
        </div>

        <p class="talk-msg" id="talk-msg" role="status" aria-live="polite"></p>
    </form>

    <!-- ⚠️ ?v= 是给静态资源做缓存击穿用的。GitHub Pages 对 js/css 设了
         Cache-Control: max-age=600，改了 comments.js 却不动这个版本号，
         回访用户最多 10 分钟还在跑旧代码。**改动 comments.js 就把它加一。**
         另外：Cloudflare 会把静态资源缓存 4 小时，部署后要清一次缓存
         （见 ~/work/yujizi-comments/deploy.sh），否则新版本可能被旧缓存盖住。
         v2：错误处理区分「断网」与「被边缘拦下」，并解析非 JSON 响应。
         v3：改为同源调用（data-api 留空），彻底不再涉及 CORS。
         v4：修掉误导性的报错文案，失败时打 console.warn 便于定位。 -->
    <script src="/js/comments.js?v=4" defer></script>
</section>

            </div>
        </main>

        <footer class="colophon">
            <div class="wrap">
                <p class="verse">剔刀锋利，越之不易。智者有云，得渡者稀。<span class="src">《奥义书》</span></p>
                <span class="foot-seal">玉</span>
                <p class="links"><a href="/index.html">返回主页</a> · <a href="#top">返回顶部</a></p>
            </div>
        </footer>
    </div>

    <a href="#top" class="totop" id="totop" aria-label="返回顶部">↑</a>

    <script src="/js/jquery-3.2.1.slim.min.js"></script>
    <!-- ⚠️ ?v= 是缓存击穿(同 comments.js 的约定)。GitHub Pages 给 js 设了
         Cache-Control: max-age=600,Cloudflare 还可能缓存更久 —— 改了
         musicplayer.js 就把它加一,否则回访用户跑的还是旧代码。
         v2:修「播放完停止」模式下不显示剩余时间。
         v3:修连续播放转场后卡在下一首开头、时长显示 0 秒(预取改为只取头部 512KB)。
         v4:加「时长 0」看门狗 —— 换曲后 10 秒元数据仍未到就重载自救。 -->
    <script src="/js/musicplayer.js?v=4"></script>
    <!-- ⚠️ 顺序有依赖:keepalive.js 用到 musicplayer.js 定义的 plog /
         pPlayIntent / musicPlayer,放在前面会 ReferenceError 静默失效。
         它只做一件事:播放期间申请 navigator.wakeLock('screen') 让屏幕常亮。
         2026-10-03 真机验证(小米 Android + Chrome)通过。
         原先的「静音导频」方案已删除,实测无效。 -->
    <script src="/js/keepalive.js?v=3"></script>
    <script>
        (function () {
            var html = document.documentElement;
            var tb = document.getElementById('theme-btn');
            if (tb) tb.addEventListener('click', function () {
                var n = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
                html.setAttribute('data-theme', n);
                try { localStorage.setItem('yjz-theme', n); } catch (e) {}
                var m = document.querySelector('meta[name=theme-color]');
                if (m) m.setAttribute('content', n === 'dark' ? '#15171b' : '#f4efe3');
            });
            var tt = document.getElementById('totop');
            if (tt) addEventListener('scroll', function () { tt.classList.toggle('show', scrollY > 500); }, { passive: true });
        })();
    </script>
</body>

</html>
